<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 확인 — 숙제·학습지 점검판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fef6ff; --bg2:#eef4ff; --bg3:#fff8ec;
  --ink:#3d3550; --sub:#8a83a0;
  --card:#ffffff; --line:#e7e2f2;
  --grape:#8b6fd6; --grape-d:#6f55b8;
  --pink:#ff8fb1; --orange:#ffab5e; --green:#5ec98d; --green-d:#3aa96c;
  --shadow:0 4px 0 rgba(0,0,0,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  color:var(--ink); background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed; overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ── 버튼 공통 ── */
.btn{
  border-radius:16px; padding:.62em 1.05em; font-size:clamp(15px,1.7vh,20px);
  background:#fff; border:2px solid var(--line); box-shadow:var(--shadow);
  transition:transform .08s, box-shadow .08s; white-space:nowrap;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.10)}
.btn.primary{background:var(--grape); color:#fff; border-color:var(--grape-d)}
.btn.green{background:var(--green); color:#fff; border-color:var(--green-d)}
.btn.ghost{background:rgba(255,255,255,.7)}

/* ── 헤더 ── */
header{
  position:sticky; top:0; z-index:20; padding:10px 14px 8px;
  background:rgba(255,255,255,.82); backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
}
.hrow{display:flex; align-items:center; gap:10px}
.title{font-size:clamp(19px,2.6vh,28px); letter-spacing:-.5px}
.title small{display:block; font-size:.52em; color:var(--sub); letter-spacing:0}
.spacer{flex:1}

/* ── 항목 탭 ── */
.tabs{display:flex; gap:8px; overflow-x:auto; padding:10px 2px 2px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; border-radius:14px 14px 0 0; padding:.5em .95em;
  font-size:clamp(15px,1.9vh,21px); background:#fff; border:2px solid var(--line);
  border-bottom:none; color:var(--sub); position:relative; top:2px;
}
.tab.on{background:var(--grape); border-color:var(--grape-d); color:#fff; top:0; padding-bottom:calc(.5em + 4px)}
.tab .n{font-size:.78em; opacity:.85; margin-left:.35em}
.tab.add{color:var(--grape); border-style:dashed}

/* ── 진행 요약 ── */
.summary{display:flex; align-items:center; gap:12px; padding:12px 16px 4px; flex-wrap:wrap}
.count{font-size:clamp(20px,3.2vh,34px)}
.count b{color:var(--pink); font-size:1.25em}
.bar{flex:1; min-width:160px; height:16px; border-radius:99px; background:#e9e4f5; overflow:hidden; border:2px solid #fff; box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--green),#8fe0b3); transition:width .35s}

/* ── 학생 카드 ── */
main{padding:8px 12px 120px}
.grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(clamp(112px,11vw,168px),1fr))}
.stu{
  border-radius:18px; padding:.7em .4em .6em; background:var(--card);
  border:3px solid var(--line); box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:transform .08s, opacity .2s, background .2s, border-color .2s;
}
.stu .no{font-size:clamp(11px,1.3vh,14px); color:var(--sub)}
.stu .nm{font-size:clamp(17px,2.3vh,25px); line-height:1.15}
.stu .mk{font-size:clamp(15px,1.9vh,20px); height:1.3em}
.stu:active{transform:scale(.95)}
.stu.todo{border-color:var(--orange); background:#fffaf2}
.stu.todo .nm{color:#c9741c}
.stu.done{opacity:.42; background:#f4f7f4; border-color:#dfe8e0}
.stu.done .nm{text-decoration:line-through; color:var(--sub)}

/* ── 아래 고정 바 ── */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:25;
  display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-top:2px solid var(--line);
  overflow-x:auto; scrollbar-width:none;
}
.dock::-webkit-scrollbar{display:none}
.dock .btn{flex:0 0 auto}
.dock .big{font-size:clamp(16px,2.1vh,22px); padding:.7em 1.3em}

/* ── 큰 화면(발표용) ── */
.show{
  position:fixed; inset:0; z-index:60; display:none;
  background:linear-gradient(150deg,#fff6fa,#f0f5ff 55%,#fffaf0);
  flex-direction:column; padding:2.2vh 3vw calc(1.6vh + env(safe-area-inset-bottom));
}
.show.on{display:flex}
.show h2{margin:0; font-size:clamp(24px,5.2vh,58px); text-align:center; line-height:1.15}
.show h2 span{color:var(--pink)}
.show .sub{text-align:center; color:var(--sub); font-size:clamp(14px,2vh,22px); margin-top:.2em}
.names{
  flex:1; margin-top:2vh; display:flex; flex-wrap:wrap; align-content:center;
  justify-content:center; gap:1.2vh 1.4vw; overflow:auto;
}
.names[hidden]{display:none}
.names span{
  background:#fff; border:4px solid var(--orange); border-radius:22px;
  padding:.35em .8em; font-size:clamp(26px,7vh,80px); color:#c9741c;
  box-shadow:0 5px 0 rgba(0,0,0,.08); line-height:1.1;
}
.allclear{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5vh}
.allclear .emo{font-size:clamp(60px,18vh,180px); line-height:1}
.allclear .txt{font-size:clamp(26px,6vh,64px); color:var(--green-d)}
.show .foot{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:1.5vh}

/* 표로 보기 */
.tblwrap{flex:1; overflow:auto; margin-top:1.5vh; -webkit-overflow-scrolling:touch}
table{border-collapse:separate; border-spacing:0; margin:0 auto; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 0 rgba(0,0,0,.07)}
th,td{padding:.45em .7em; font-size:clamp(14px,2.2vh,24px); text-align:center; border-bottom:2px solid var(--line); white-space:nowrap}
th{background:#f6f2ff; position:sticky; top:0; z-index:2}
th:first-child,td:first-child{text-align:right; background:#fbf9ff; position:sticky; left:0; z-index:1}
th:first-child{z-index:3}
td.x{color:var(--pink); font-size:1.15em}
td.o{color:#cfd8cf}
tr.hasx td:first-child{color:#c9741c}

/* ── 모달 ── */
.modal{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(60,50,80,.35); backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{
  width:min(560px,100%); max-height:88vh; overflow:auto; background:#fff;
  border-radius:24px; border:3px solid var(--line); box-shadow:0 10px 0 rgba(0,0,0,.10); padding:18px;
}
.sheet h3{margin:.1em 0 .5em; font-size:clamp(19px,2.6vh,26px)}
.sheet p.hint{margin:.2em 0 .7em; color:var(--sub); font-size:clamp(13px,1.7vh,17px); line-height:1.5}
label.f{display:block; margin:.9em 0 .3em; font-size:clamp(15px,1.9vh,19px)}
input[type=text],textarea{
  width:100%; font-family:inherit; font-size:clamp(16px,2vh,20px); color:var(--ink);
  border:2px solid var(--line); border-radius:14px; padding:.6em .75em; background:#fdfcff;
}
textarea{min-height:34vh; line-height:1.55; resize:vertical}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.row.end{justify-content:flex-end}
.toggle{display:flex; align-items:center; gap:10px; margin-top:1em; font-size:clamp(15px,1.9vh,19px)}
.sw{width:52px; height:30px; border-radius:99px; background:#ddd6ee; position:relative; flex:0 0 auto; transition:background .18s}
.sw i{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .18s}
.sw.on{background:var(--green)}
.sw.on i{left:25px}
.danger{color:#d9534f}
.itemlist{display:flex; flex-direction:column; gap:8px; margin-top:.5em}
.itemrow{display:flex; gap:8px; align-items:center}
.itemrow input{flex:1}
.mini{font-size:clamp(13px,1.6vh,16px); padding:.5em .7em; border-radius:12px}
.empty{text-align:center; color:var(--sub); padding:14vh 8px; font-size:clamp(16px,2.2vh,22px); line-height:1.7}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="title">오늘의 확인<small id="klassName">우리 반</small></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnSetting">⚙️ 설정</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="summary" id="summary" hidden>
  <div class="count" id="cntTodo">아직 <b>0</b>명</div>
  <div class="bar"><i id="barFill" style="width:0%"></i></div>
  <div class="count" style="font-size:clamp(14px,1.9vh,20px);color:var(--sub)" id="cntText">0 / 0</div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="dock" id="dock" hidden>
  <button class="btn primary big" id="btnShow">📺 크게 보기</button>
  <button class="btn green" id="btnAllDone">모두 냈어요</button>
  <button class="btn" id="btnReset">이 항목 다시</button>
  <button class="btn" id="btnCopy">📋 명단 복사</button>
</div>

<!-- 큰 화면 -->
<div class="show" id="show">
  <h2 id="showTitle"></h2>
  <div class="sub" id="showSub"></div>
  <div class="names" id="showNames"></div>
  <div class="tblwrap" id="showTable" hidden></div>
  <div class="foot">
    <button class="btn" id="btnTableMode">📊 표로 보기</button>
    <button class="btn primary" id="btnCloseShow">닫기</button>
  </div>
</div>

<!-- 설정 -->
<div class="modal" id="mSetting">
  <div class="sheet">
    <h3>⚙️ 설정</h3>

    <label class="f">우리 반 이름</label>
    <input type="text" id="inKlass" placeholder="예) 4학년 3반" maxlength="20">

    <label class="f">명렬표 붙여넣기</label>
    <p class="hint">엑셀·한글에서 이름을 <b>복사해서 그대로 붙여넣으세요.</b><br>
      줄바꿈·쉼표·번호(1. 김민준)가 섞여 있어도 알아서 정리합니다.</p>
    <textarea id="inRoster" placeholder="김민준&#10;이서연&#10;박도윤&#10;…"></textarea>
    <p class="hint" id="rosterCount">0명</p>

    <div class="toggle" id="tgNumOnly">
      <div class="sw"><i></i></div>
      <div>큰 화면에서 <b>번호만</b> 보여주기</div>
    </div>
    <p class="hint">이름 대신 「7번」처럼 번호로만 뜹니다. 교실 앞에 띄울 때 쓰세요.</p>

    <div class="row end">
      <button class="btn danger mini" id="btnWipe">전체 지우기</button>
      <div class="spacer"></div>
      <button class="btn" id="btnCancelSetting">취소</button>
      <button class="btn primary" id="btnSaveSetting">저장</button>
    </div>
  </div>
</div>

<!-- 항목 관리 -->
<div class="modal" id="mItems">
  <div class="sheet">
    <h3>📚 확인할 것</h3>
    <p class="hint">숙제, 학습지, 알림장 사인처럼 확인할 것을 만들어 두세요. 이름은 눌러서 고칠 수 있어요.</p>
    <div class="itemlist" id="itemList"></div>
    <div class="row">
      <button class="btn primary" id="btnAddItem">+ 새로 만들기</button>
      <div class="spacer"></div>
      <button class="btn" id="btnCloseItems">닫기</button>
    </div>
  </div>
</div>

<script>
const KEY='hw_check_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);

let S=load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); if(d&&d.students) return normalize(d); }
  }catch(e){}
  return normalize({klass:'우리 반', students:[], items:[], active:null, numOnly:false});
}
function normalize(d){
  d.klass=d.klass||'우리 반';
  d.students=(d.students||[]).map((s,i)=>({id:s.id||uid(), no:s.no||i+1, name:s.name||''}));
  d.items=(d.items||[]).map(it=>({id:it.id||uid(), name:it.name||'숙제', date:it.date||today(), done:it.done||{}}));
  if(!d.items.some(i=>i.id===d.active)) d.active=d.items[0]?d.items[0].id:null;
  d.numOnly=!!d.numOnly;
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function today(){ const t=new Date(); return `${t.getMonth()+1}/${t.getDate()}`; }
const item=()=>S.items.find(i=>i.id===S.active)||null;
const todoOf=it=>S.students.filter(s=>!it.done[s.id]);
const label=s=>S.numOnly? s.no+'번' : s.name;

/* ── 그리기 ── */
function render(){
  $('#klassName').textContent=S.klass;
  $('#inKlass').value=S.klass;

  // 탭
  const tabs=$('#tabs'); tabs.innerHTML='';
  S.items.forEach(it=>{
    const b=document.createElement('button');
    b.className='tab'+(it.id===S.active?' on':'');
    const n=todoOf(it).length;
    b.innerHTML=`${esc(it.name)}<span class="n">${n?n+'명':'✅'}</span>`;
    b.onclick=()=>{ S.active=it.id; save(); render(); };
    tabs.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='tab add'; add.textContent='＋ 항목';
  add.onclick=openItems; tabs.appendChild(add);

  const it=item();
  const noStudent=S.students.length===0;
  $('#summary').hidden = noStudent||!it;
  $('#dock').hidden    = noStudent||!it;
  $('#empty').hidden   = !(noStudent||!it);
  $('#grid').innerHTML='';

  if(noStudent){
    $('#empty').innerHTML='아직 우리 반 아이들이 없어요.<br>오른쪽 위 <b>⚙️ 설정</b>에서<br>명렬표를 붙여넣어 주세요 🙂';
    return;
  }
  if(!it){
    $('#empty').innerHTML='확인할 것을 하나 만들어 주세요.<br>위쪽 <b>＋ 항목</b>을 눌러<br>「숙제」「수학 학습지」처럼 만들면 돼요 📚';
    return;
  }

  // 학생 카드
  const g=$('#grid');
  S.students.forEach(s=>{
    const done=!!it.done[s.id];
    const b=document.createElement('button');
    b.className='stu '+(done?'done':'todo');
    b.innerHTML=`<div class="no">${s.no}번</div><div class="nm">${esc(s.name)}</div><div class="mk">${done?'✅':'⬜'}</div>`;
    b.onclick=()=>{ if(done) delete it.done[s.id]; else it.done[s.id]=1; save(); render(); };
    g.appendChild(b);
  });

  const todo=todoOf(it).length, tot=S.students.length, ok=tot-todo;
  $('#cntText').textContent=`${ok} / ${tot}`;
  $('#barFill').style.width=(tot?ok/tot*100:0)+'%';
  $('#cntTodo').innerHTML = todo
    ? `아직 <b>${todo}</b>명` : `모두 냈어요 <b>🎉</b>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── 큰 화면 ── */
let tableMode=false;
function openShow(){
  tableMode=false; drawShow(); $('#show').classList.add('on');
}
function drawShow(){
  const it=item(); if(!it) return;
  $('#showTable').hidden=!tableMode;
  $('#showNames').hidden=tableMode;
  $('#btnTableMode').textContent = tableMode? '📋 명단으로' : '📊 표로 보기';

  if(tableMode){
    const its=S.items;
    const rows=S.students.filter(s=>its.some(i=>!i.done[s.id]));
    $('#showTitle').innerHTML= rows.length
      ? `한눈에 보기 — <span>${rows.length}명</span>` : '한눈에 보기';
    $('#showSub').textContent= rows.length
      ? '아직 안 낸 것이 있는 친구만 모았어요 (✗ 표시가 안 낸 것)' : '';
    if(!rows.length){
      $('#showTable').innerHTML=`<div class="allclear"><div class="emo">🎉</div><div class="txt">밀린 친구가 한 명도 없어요!</div></div>`;
      return;
    }
    let h='<table><thead><tr><th>이름</th>'+its.map(i=>`<th>${esc(i.name)}</th>`).join('')+'</tr></thead><tbody>';
    rows.forEach(s=>{
      const cells=its.map(i=>i.done[s.id]?'<td class="o">·</td>':'<td class="x">✗</td>');
      h+=`<tr class="hasx"><td>${s.no}. ${esc(label(s))}</td>${cells.join('')}</tr>`;
    });
    h+='</tbody></table>';
    $('#showTable').innerHTML=h;
    return;
  }

  const todo=todoOf(it);
  $('#showTitle').innerHTML= todo.length
    ? `${esc(it.name)} — 아직 <span>${todo.length}명</span>`
    : `${esc(it.name)}`;
  $('#showSub').textContent= todo.length? '이름이 보이면 오늘 안에 꼭 내주세요!' : '';
  const box=$('#showNames');
  if(!todo.length){
    box.innerHTML=`<div class="allclear"><div class="emo">🎉</div><div class="txt">우리 반 모두 다 했어요!</div></div>`;
  }else{
    box.innerHTML=todo.map(s=>`<span>${esc(label(s))}</span>`).join('');
  }
}

/* ── 항목 관리 ── */
function openItems(){ drawItems(); $('#mItems').classList.add('on'); }
function drawItems(){
  const box=$('#itemList'); box.innerHTML='';
  if(!S.items.length){ box.innerHTML='<p class="hint">아직 없어요. 아래에서 만들어 주세요.</p>'; }
  S.items.forEach(it=>{
    const row=document.createElement('div'); row.className='itemrow';
    const inp=document.createElement('input'); inp.type='text'; inp.value=it.name; inp.maxLength=20;
    inp.oninput=()=>{ it.name=inp.value; save(); render(); };
    const del=document.createElement('button'); del.className='btn mini danger'; del.textContent='삭제';
    del.onclick=()=>{
      S.items=S.items.filter(x=>x.id!==it.id);
      if(S.active===it.id) S.active=S.items[0]?S.items[0].id:null;
      save(); drawItems(); render();
    };
    row.append(inp,del); box.appendChild(row);
  });
}

/* ── 명렬표 파싱 ── */
function parseRoster(text){
  const out=[];
  text.split(/[\n\r]+/).forEach(line=>{
    line.split(/[,\t]+/).forEach(raw=>{
      let t=raw.trim();
      if(!t) return;
      t=t.replace(/^\(?\d{1,2}\)?\s*[.)_·]?\s*/,'').trim(); // 앞 번호 제거
      if(!t) return;
      out.push(t);
    });
  });
  return out;
}
function rosterText(){ return S.students.map(s=>`${s.no}. ${s.name}`).join('\n'); }

/* ── 이벤트 ── */
$('#btnSetting').onclick=()=>{
  $('#inKlass').value=S.klass;
  $('#inRoster').value=rosterText();
  $('#rosterCount').textContent=S.students.length+'명';
  $('#tgNumOnly').firstElementChild.classList.toggle('on',S.numOnly);
  $('#mSetting').classList.add('on');
};
$('#inRoster').oninput=e=>{ $('#rosterCount').textContent=parseRoster(e.target.value).length+'명'; };
$('#tgNumOnly').onclick=()=>$('#tgNumOnly').firstElementChild.classList.toggle('on');
$('#btnCancelSetting').onclick=()=>$('#mSetting').classList.remove('on');
$('#btnSaveSetting').onclick=()=>{
  S.klass=$('#inKlass').value.trim()||'우리 반';
  S.numOnly=$('#tgNumOnly').firstElementChild.classList.contains('on');
  const names=parseRoster($('#inRoster').value);
  // 이름이 같으면 기존 체크 상태를 이어받는다
  const oldByName={}; S.students.forEach(s=>{ if(!(s.name in oldByName)) oldByName[s.name]=s.id; });
  const next=names.map((n,i)=>({id:oldByName[n]||uid(), no:i+1, name:n}));
  const keep=new Set(next.map(s=>s.id));
  S.items.forEach(it=>{ Object.keys(it.done).forEach(k=>{ if(!keep.has(k)) delete it.done[k]; }); });
  S.students=next;
  if(S.students.length && !S.items.length){
    S.items=[{id:uid(),name:'숙제',date:today(),done:{}}]; S.active=S.items[0].id;
  }
  save(); render(); $('#mSetting').classList.remove('on');
};
$('#btnWipe').onclick=()=>{
  if(!confirmBox('정말 모두 지울까요?\n이름과 체크한 것이 전부 사라져요.')) return;
  S=normalize({}); save(); render(); $('#mSetting').classList.remove('on');
};

$('#btnAddItem').onclick=()=>{
  const it={id:uid(),name:'새 항목',date:today(),done:{}};
  S.items.push(it); S.active=it.id; save(); drawItems(); render();
  const inputs=$$('#itemList input'); const last=inputs[inputs.length-1];
  if(last){ last.focus(); last.select(); }
};
$('#btnCloseItems').onclick=()=>$('#mItems').classList.remove('on');

$('#btnShow').onclick=openShow;
$('#btnCloseShow').onclick=()=>$('#show').classList.remove('on');
$('#btnTableMode').onclick=()=>{ tableMode=!tableMode; drawShow(); };
$('#btnAllDone').onclick=()=>{
  const it=item(); if(!it) return;
  S.students.forEach(s=>it.done[s.id]=1); save(); render();
};
$('#btnReset').onclick=()=>{
  const it=item(); if(!it) return;
  if(!confirmBox(`「${it.name}」 체크를 모두 지울까요?`)) return;
  it.done={}; save(); render();
};
$('#btnCopy').onclick=async ()=>{
  const it=item(); if(!it) return;
  const todo=todoOf(it);
  const txt = todo.length
    ? `[${it.name}] 아직 안 낸 친구 ${todo.length}명\n`+todo.map(s=>`${s.no}. ${s.name}`).join('\n')
    : `[${it.name}] 모두 냈습니다 🎉`;
  try{ await navigator.clipboard.writeText(txt); toast('명단을 복사했어요 📋'); }
  catch(e){ toast('복사가 안 됐어요 😢'); }
};

// 모달 바깥 클릭으로 닫기
$$('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('on'); }));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ $('#show').classList.remove('on'); $$('.modal').forEach(m=>m.classList.remove('on')); }
});

function confirmBox(msg){ return window.confirm(msg); }
let toastTimer;
function toast(msg){
  let t=$('#toast');
  if(!t){
    t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;background:rgba(61,53,80,.92);color:#fff;padding:.7em 1.2em;border-radius:16px;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.2);transition:opacity .25s';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity='0',1600);
}

render();
if(!S.students.length) $('#btnSetting').click();
</script>
</body>
</html>
